<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>
</head>
<body>
    <h1>My To-Do List</h1>
    <form method="post" action="/add/">
        {% csrf_token %}
        <input type="text" name="title" placeholder="Enter task">
        <button type="submit">Add</button>
    </form>
    <ul>
        {% for task in tasks %}
            <li>
                {% if task.completed %}
                    <s>{{ task.title }}</s>
                {% else %}
                    {{ task.title }}
                    <a href="/complete/{{ task.id }}/">Complete</a>
                {% endif %}
                <a href="/delete/{{ task.id }}/">Delete</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
